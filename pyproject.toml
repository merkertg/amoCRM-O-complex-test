[project]
name = "amocrm-sales-assistant"
version = "1.0.0"
description = "AI-ассистент менеджера по продажам для amoCRM"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
target-version = "py312"
src = [".", "scripts"]
extend-exclude = [".claude"]

[tool.ruff.lint]
# Catch code errors and keep imports consistent without reformatting prose.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
enable_error_code = ["ignore-without-code"]
